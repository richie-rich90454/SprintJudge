name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay / scoring
        - Judge / code execution
        - Admin panel
        - Question bank
        - Developer experience
        - Documentation
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Would you be willing to implement this?
      description: Say yes and mention any relevant experience; a maintainer can guide you.

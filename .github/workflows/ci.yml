name: CI

on:
  push:
    branches: [development, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SPRINTJUDGE_ADMIN_PASSWORD: ci-admin-password

jobs:
  backend:
    # Several executor tests drive `cmd` directly and are Windows-only.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build the SPA (the jar packaging step requires dist/)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Backend tests and 100% coverage
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Unit tests and coverage
        working-directory: frontend
        run: npm run test:unit
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: UI rules
        run: node scripts/check-ui.mjs
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Package and start the backend
        run: |
          ./mvnw -B -DskipTests package > package.log 2>&1
          java -jar target/sprintjudge.jar --spring.profiles.active=prod --server.port=8080 \
            --sprintjudge.executor.public-run=true > backend.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "backend did not become healthy"; tail -100 backend.log; exit 1
      - name: Start the frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173 > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "vite did not start"; cat vite.log; exit 1
      - name: Run the live practice flow
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test --project=chromium
      - name: Logs on failure
        if: failure()
        run: |
          tail -200 backend.log || true
          tail -100 frontend/vite.log || true

  jar-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Package the jar
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          ./mvnw -B -DskipTests package
      - name: Boot and probe health
        run: |
          java -jar target/sprintjudge.jar --spring.profiles.active=prod \
            --server.port=8091 > jar.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8091/actuator/health | grep -q '"UP"'; then
              echo "jar healthy"; exit 0
            fi
            sleep 2
          done
          echo "jar did not become healthy"; tail -150 jar.log; exit 1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: CSA admin flow (production-served SPA)
        working-directory: frontend
        env:
          CI: "true"
          SPRINTJUDGE_BACKEND_URL: http://127.0.0.1:8091
        run: npx playwright test e2e/admin.spec.ts --project=chromium

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
      - name: OWASP dependency check (fails on CVSS >= 7)
        env:
          # Do NOT call this NVD_API_KEY: dependency-check reads that env var
          # directly and chokes on an empty value when the secret is absent.
          OQ_NVD_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          extra=""
          if [ -n "${OQ_NVD_KEY:-}" ]; then extra="-DnvdApiKey=$OQ_NVD_KEY"; fi
          ./mvnw -B -ntp org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 -DskipTests $extra

  deploy-config:
    name: Deploy configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and stray-marker check
        run: |
          bash -n deploy/*.sh scripts/*.sh executor/compile-scripts/*.sh
          if grep -R -n -E '^(EOF|ENVFILE)$' deploy/ scripts/; then
            echo "deploy-config: stray heredoc terminator in a config file" >&2
            exit 1
          fi
      - name: systemd unit syntax (when available)
        run: |
          if command -v systemd-analyze >/dev/null 2>&1; then
            systemd-analyze verify deploy/sprintjudge.service
          else
            echo "systemd-analyze unavailable; skipped"
          fi

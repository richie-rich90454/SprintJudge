openapi: 3.0.3
info:
  title: SprintJudge Bank API (additive)
  version: 1.2.0
paths:
  /api/admin/bank/search:
    get:
      summary: Search the structured bank by subject, unit, scope, and format.
      parameters:
        - { name: subject, in: query, required: true, schema: { type: string } }
        - { name: unit, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [current-scope, legacy-scope, core-scope, everything] } }
        - { name: format, in: query, schema: { type: string } }
      responses:
        '200': { description: answer-free headers only }
  /api/admin/bank/question/{id}:
    get:
      summary: Fetch one answer-free question header for teachers.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: single question header }
        '404': { description: unknown id }
  /api/admin/bank/coverage/{subject}:
    get:
      summary: Format and scope coverage per unit.
      parameters:
        - { name: subject, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: coverage report }
  /api/admin/bank/volume:
    get:
      summary: Question totals per subject.
      responses:
        '200': { description: volume report }
  /api/public/scoring/signal:
    get:
      summary: Plain-language speed-accuracy signal plus tier for inputs.
      parameters:
        - { name: medianSeconds, in: query, required: true, schema: { type: number } }
        - { name: questionMedian, in: query, required: true, schema: { type: number } }
        - { name: accuracy, in: query, required: true, schema: { type: number } }
        - { name: sjs, in: query, schema: { type: number } }
      responses:
        '200': { description: signal code, plain-language copy, and tier }
  /api/admin/bank/calibration/{questionId}:
    get:
      summary: Persisted calibration row for one question.
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: pValue, discrimination, and attempts }
        '404': { description: unknown question id }
  /api/admin/bank/calibration/run:
    post:
      summary: Recompute calibrations from submissions and persist them.
      responses:
        '200': { description: calibrated entry count }
  /api/admin/export/room/{sessionId}:
    get:
      summary: Teacher export of one room session as CSV or JSON rows.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, json] } }
      responses:
        '200': { description: CSV text or JSON rows ordered by question then player }

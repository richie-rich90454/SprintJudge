<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0c0f14" />
        <meta
            name="description"
            content="SprintJudge: self-hosted live classroom quizzes with real code judging. Join with a PIN, no accounts."
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <title>SprintJudge</title>
        <link
            rel="preload"
            href="/fonts/noto-sans-latin-var.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/fonts/noto-sans-mono-latin-var.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <script>
            // Apply persisted theme before first paint to avoid a flash.
            (function () {
                try {
                    var t = localStorage.getItem("oq-theme");
                    if (t === "light") document.documentElement.classList.remove("dark");
                    else document.documentElement.classList.add("dark"); // dark is the default
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#fff0e4" />
        <meta
            name="description"
            content="SprintJudge: self-hosted live classroom quizzes with real code judging. Join with a PIN, no accounts."
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <title>SprintJudge</title>
        <link
            rel="preload"
            href="/fonts/noto-sans-latin-var.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <script>
            // Light-only lockdown: never start dark, ignore any persisted value.
            (function () {
                try {
                    document.documentElement.classList.remove("dark");
                    localStorage.setItem("oq-theme", "light");
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>

openquiz:
  executor:
    # Windows hosts have no nsjail; Linux production should pin nsjail via
    # OPENQUIZ_EXECUTOR_MODE=nsjail (the systemd unit already does).
    mode: ${OPENQUIZ_EXECUTOR_MODE:native}
  db:
    # Portable default; override with OPENQUIZ_DB_PATH on servers.
    path: ${OPENQUIZ_DB_PATH:./data/openquiz.db}
server:
  port: ${OPENQUIZ_PORT:8080}

sprintjudge:
  executor:
    # Windows hosts have no nsjail; Linux production should pin nsjail via
    # SPRINTJUDGE_EXECUTOR_MODE=nsjail (the systemd unit already does).
    mode: ${SPRINTJUDGE_EXECUTOR_MODE:native}
  db:
    # Defaults next to the running jar (sprintjudge.app-dir is injected by the
    # .env loader). Override with SPRINTJUDGE_DB_PATH or a local .env file.
    path: ${SPRINTJUDGE_DB_PATH:${sprintjudge.app-dir:./}/sprintjudge.db}
server:
  port: ${SPRINTJUDGE_PORT:8080}

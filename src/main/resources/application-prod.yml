sprintjudge:
  executor:
    # Windows hosts have no nsjail; Linux production should pin nsjail via
    # SPRINTJUDGE_EXECUTOR_MODE=nsjail (the systemd unit already does).
    mode: ${SPRINTJUDGE_EXECUTOR_MODE:native}
  db:
    # Next to the working directory by default; override with
    # SPRINTJUDGE_DB_PATH or a local .env file.
    path: ${SPRINTJUDGE_DB_PATH:./sprintjudge.db}
server:
  port: ${SPRINTJUDGE_PORT:8080}
  servlet:
    session:
      cookie:
        # Flip via SPRINTJUDGE_COOKIE_SECURE=true behind TLS-terminating nginx.
        secure: ${SPRINTJUDGE_COOKIE_SECURE:false}

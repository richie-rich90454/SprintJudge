sprintjudge:
  executor:
    # Native toolchains by default so a fresh Windows box tests the full OJ
    # flow with zero WSL setup. Set SPRINTJUDGE_EXECUTOR_MODE=wsl for isolation.
    mode: ${SPRINTJUDGE_EXECUTOR_MODE:native}
  db:
    path: ./sprintjudge.db
logging:
  level:
    com.sprintjudge: DEBUG

sprintjudge:
  executor:
    # Native toolchains: no WSL and no extra runtime. Requires gcc/g++/javac/
    # node/python on PATH for the OJ flow; on Linux use nsjail for isolation.
    mode: ${SPRINTJUDGE_EXECUTOR_MODE:native}
  db:
    path: ./database/sprintjudge.db
server:
  servlet:
    session:
      cookie:
        secure: false
logging:
  level:
    com.sprintjudge: DEBUG

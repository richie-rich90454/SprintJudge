spring:
  application:
    name: sprintjudge
  profiles:
    active: dev
  sql:
    init:
      # Schema is applied by SqlScriptRunner at DataSource creation (Flyway
      # has no SQLite support). Keep Spring's own SQL init disabled.
      mode: never
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          microsoft:
            client-id: ${SPRINTJUDGE_MS_CLIENT_ID:placeholder}
            client-secret: ${SPRINTJUDGE_MS_CLIENT_SECRET:placeholder}
            client-name: Microsoft Entra ID
            scope: openid,profile,email
            redirect-uri: ${SPRINTJUDGE_OAUTH2_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            authorization-grant-type: authorization_code
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/${SPRINTJUDGE_MS_TENANT_ID:common}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${SPRINTJUDGE_MS_TENANT_ID:common}/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub

sprintjudge:
  db:
    path: ./sprintjudge.db
  cors:
    # Same-origin by default (Vite dev proxy). Set explicit origins in production.
    allowed-origins: "http://localhost:5173"
  admin-emails: ${SPRINTJUDGE_ADMIN_EMAILS:}
  executor:
    # "native" (Windows dev + Windows prod) | "wsl" (Windows dev, WSL2 isolation)
    # | "nsjail" (Linux production) | "auto" count below.
    mode: ${SPRINTJUDGE_EXECUTOR_MODE:wsl}
    max-concurrent: auto        # or a number; "auto" = cores x concurrency-factor
    concurrency-factor: 8       # floor 8, cap 512
    timeout-sec: 10
    nsjail-binary: /usr/bin/nsjail
    work-dir: ./executor/tmp
    compile-scripts-dir: ./executor/compile-scripts
    compile-cache:
      dir: ./executor/cache
      max-entries: 512
      max-mb: 512
  room:
    max-players: 10000
  broadcast:
    coalesce-ms: 16
  persistence:
    flush-ms: 250
    buffer-capacity: 20000
  security:
    admin:
      default-role: ADMIN

server:
  port: 8080

springdoc:
  api-docs:
    enabled: false

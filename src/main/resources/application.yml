spring:
  application:
    name: sprintjudge
  profiles:
    active: dev
  sql:
    init:
      # Schema is applied by SqlScriptRunner at DataSource creation (Flyway
      # has no SQLite support). Keep Spring's own SQL init disabled.
      mode: never
  jackson:
    default-property-inclusion: non_null
  # OAuth2 client config temporarily removed (unwired for MVP).
  # Re-add spring.security.oauth2.client.registration.* here when re-enabling
  # Microsoft Entra ID login — see .env.example for env var names.

sprintjudge:
  db:
    path: ./sprintjudge.db
  cors:
    # Same-origin by default (Vite dev proxy). Set explicit origins in production.
    allowed-origins: "http://localhost:5173"
  admin:
    username: ${SPRINTJUDGE_ADMIN_USERNAME:admin}
    password: ${SPRINTJUDGE_ADMIN_PASSWORD:changeme}
  executor:
    # "native" (Windows dev + Windows prod) | "wsl" (Windows dev, WSL2 isolation)
    # | "nsjail" (Linux production) | "auto" count below.
    mode: ${SPRINTJUDGE_EXECUTOR_MODE:wsl}
    max-concurrent: auto        # or a number; "auto" = cores x concurrency-factor
    concurrency-factor: 8       # floor 8, cap 512
    timeout-sec: 10
    nsjail-binary: /usr/bin/nsjail
    work-dir: ./executor/tmp
    compile-scripts-dir: ./executor/compile-scripts
    compile-cache:
      dir: ./executor/cache
      max-entries: 512
      max-mb: 512
  room:
    max-players: 10000
  broadcast:
    coalesce-ms: 16
  persistence:
    flush-ms: 250
    buffer-capacity: 20000
  security:
    admin:
      default-role: ADMIN

server:
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true
        secure: false
  port: 8080

springdoc:
  api-docs:
    enabled: false
